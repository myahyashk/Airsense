<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#184e86" />
      <stop offset="100%" stop-color="#0b1626" />
    </linearGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f9eff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#4f9eff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ec4a6" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#2ec4a6" />
      <stop offset="100%" stop-color="#7bf5df" />
    </linearGradient>
    <linearGradient id="lineGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Navy Badge -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#badgeGrad)" stroke="#234e7f" stroke-width="1.5" />

  <!-- Flowing Air Line 1 (Top Wave) -->
  <path d="M 10 18 C 16 14, 22 22, 30 18 C 34 16, 36 17, 38 18" stroke="url(#lineGrad1)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Flowing Air Line 2 (Middle Smooth Wave) -->
  <path d="M 8 25 C 15 21, 21 29, 29 25 C 33 23, 35 24, 37 25" stroke="url(#lineGrad2)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Flowing Air Line 3 (Bottom Wave) -->
  <path d="M 11 32 C 17 28, 23 36, 31 32 C 34 30, 36 31, 38 32" stroke="url(#lineGrad3)" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Signal Dot & Concentric Radar Arcs -->
  <g transform="translate(36, 12)">
    <circle cx="0" cy="0" r="2.5" fill="#2ec4a6" filter="url(#glow)" />
    <!-- Signal Arc 1 -->
    <path d="M 2 -4 A 5 5 0 0 1 5 -1" stroke="#2ec4a6" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85" />
    <!-- Signal Arc 2 -->
    <path d="M 4 -7 A 8 8 0 0 1 8 -3" stroke="#4f9eff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>
</svg>
